# put_X_supermarket_shelf 组(task/RoboSafeJanus/tasks/put_X_supermarket_shelf.py),所有任务布局相同,只换手上的商品。
# 超市货架 GenieSim_supermarket_shelf/00006 的静态盒子碰撞体变体(ext_assets/integrate/supermarket_shelf_box.py),
# 原尺寸立在桌面上,转 -90 度:开口(资产 +x)朝机器人(-y),宽 1.05 m 沿世界 x。只用最下层:层板上表面在桌面以上
# 0.104 m,上一层层板底面在 0.389 m(净高 0.285 m),层板深 0.31 m(资产 x -0.145 ~ 0.166,前沿在世界 y ~= center - 0.166)。
# 最下层一半是食品区(food_display_1/2),一半是日化区(cleaning_display_1/2),"mirror: zones" 让两个区每局随机左右对调
# (支撑面坐标系 y = 世界 x)。手上的商品立在货架前方桌面中间,目标是食品区里靠货架中心的空位;
# 脚本专家用食品区那一侧的手臂。
# 食品:乐事薯片筒(直径 7 cm,高 20.6 cm);日化:洁厕剂瓶,缩放 0.8(4.5 x 9.1 x 21.6 cm)。
Geometry:
  -
    common:
      xlim: [-0.02, 0.02]
      ylim: [0.10, 0.12]
      rotate_rand: True
      rotate_deg: [-92, -88]
      # 布局生成器按外接圆让物体彼此分开(货架 r 0.56 m);缩小它,商品才能放在货架前方手臂够得到的地方
      margin: -0.40
      relative_plane: "Table"

    category:
      -
        name: "GenieSim_supermarket_shelf_box"
        index: [6]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["shelf"]

Rigid:
  -
    common:
      # 货架前沿(世界 y ~= -0.06)前方。窄的一边(资产 x)沿世界 x:手指沿 x 横跨它、从机器人一侧接近
      xlim: [-0.04, 0.04]
      ylim: [-0.24, -0.18]
      rotate_rand: True
      rotate_deg: [-20, 20]
      physics:
        static_friction: 1.0
      relative_plane: "Table"

    category:
      -
        name: "GenieSim_cleaning_products_s080"
        index: [11]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["toilet_cleaner"]

  # 食品区(默认在左:支撑面坐标系 -y = 世界 -x)
  -
    common:
      xlim: [-0.03]
      ylim: [-0.28]
      qpos: [1.0, 0.0, 0.0, 0.0]
      rotate_rand: False
      relative_plane: "shelf/shelf/bottom"
      mirror: "zones"
      physics:
        static_friction: 1.0

    category:
      -
        name: "GenieSim_snack"
        index: [34]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["food_display_1"]
  -
    common:
      xlim: [-0.03]
      ylim: [-0.38]
      qpos: [1.0, 0.0, 0.0, 0.0]
      rotate_rand: False
      relative_plane: "shelf/shelf/bottom"
      mirror: "zones"
      physics:
        static_friction: 1.0

    category:
      -
        name: "GenieSim_snack"
        index: [34]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["food_display_2"]

  # 日化区(默认在右)
  -
    common:
      xlim: [-0.03]
      ylim: [0.28]
      qpos: [1.0, 0.0, 0.0, 0.0]
      rotate_rand: False
      relative_plane: "shelf/shelf/bottom"
      mirror: "zones"
      physics:
        static_friction: 1.0

    category:
      -
        name: "GenieSim_cleaning_products_s080"
        index: [11]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["cleaning_display_1"]
  -
    common:
      xlim: [-0.03]
      ylim: [0.4]
      qpos: [1.0, 0.0, 0.0, 0.0]
      rotate_rand: False
      relative_plane: "shelf/shelf/bottom"
      mirror: "zones"
      physics:
        static_friction: 1.0

    category:
      -
        name: "GenieSim_cleaning_products_s080"
        index: [11]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["cleaning_display_2"]
