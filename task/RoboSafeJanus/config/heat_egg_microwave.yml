Articulation:
  -
    common:
      # 正面（门一侧）朝向机器人（-y）。SimReady 微波炉（ext_assets SimReady D00516，原尺寸）：body 0.51 x
      # 0.37 x 0.30 m，铰链在左边缘，关节 0 度就是门开 90 度（门 link 已经在 -y 侧立着），open_door() 把它置到
      # 下限 0 度；门打开后立在 x ~= center - 0.27、y ~= center - 0.56 .. center - 0.16。桌上相机支架底板占
      # y -0.515..-0.425、x +-0.15，所以中心 y 要 >= 0.14；中心还要在左臂导轨（x ~= -0.3，+-0.09）右侧。
      # 位置定死（与 heat_sandwich_microwave 一致）：中心 (0.05, 0.16)、朝 -y。
      xlim: [0.05, 0.05]
      ylim: [0.16, 0.16]
      rotate_rand: False
      # 资产的 bbox 把开着的门（伸到 y -0.56）也算进去，占地圆会大到手放不下物体；这里显式给 body 的占地尺寸。
      footprint: [0.508, 0.367]
      margin: -0.05
      relative_plane: "Table"

    category:
      -
        name: "SimReady_microwave"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["microwave"]

Rigid:
  -
    common:
      # 位于微波炉前方右臂一侧，在打开的门扫过的区域之外。
      # 范围同 heat_sandwich_microwave（那边按采集结果定的）
      xlim: [0.10, 0.30]
      ylim: [-0.35, -0.22]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"
      # 侧躺：鸡蛋（SimReady_egg，5.96 x 8.0 x 5.96 cm，长轴沿局部 y，metadata 只有 active.place.up）
      # 绕 z 转 90 度，长轴放平、高 5.96 cm；竖直站立底面积小会倒。与 rotate_deg 的偏航叠在一起仍是绕 z 转，
      # 只有长轴朝向变化。
      qpos: [0.7071, 0.0, 0.0, 0.7071]
      physics:
        mass: 0.1329  # 资产源数据（SimReady_egg）；2026-11-15 对照实验：0.06 与 0.1329 成功率相同，关键是抓取筛选
        static_friction: 0.6
        dynamic_friction: 1.5

    category:
      -
        # 源资产的 sdf 碰撞由 ext_link 改成 convexHull（CPU 物理下 sdf 不生效），原资产可直接用
        name: "SimReady_egg"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["egg"]
