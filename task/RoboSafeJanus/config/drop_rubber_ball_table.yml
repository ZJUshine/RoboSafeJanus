# 橡胶球:Clutter/ball/00001(6.9 cm 的球)的 Rigid 变体 Rigid/ball_s100(ext_assets/integrate/scaled_variant.py,比例 1.0)。
# 变体的 object.usd 在根 prim 上另加了 PhysxRigidBodyAPI angularDamping = 8:不加时球在桌上一直滚,采集的布局稳定性
# 检查(转动 > 5 度)每次都不过(data/debug/drop/r1、r2)。
# 物体放在机器人前方偏右的桌面上;右臂用 GraspGenX 的抓取夹起来,竖直抬到物体最低处离桌面约 25 cm,松手让它落回桌面,
# 再回初始位姿(专家见 experts/drop_rubber_ball_table.py)。drop_rubber_ball_table / drop_vase_table / drop_glass_cup_table / drop_wine_bottle_table
# 用同样的位置。
Rigid:
  -
    common:
      xlim: [0.08, 0.18]
      ylim: [-0.20, -0.10]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"
      physics:
        mass: 0.06
        static_friction: 1.0

    category:
      -
        name: "ball_s100"
        index: [1]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["rubber_ball"]
