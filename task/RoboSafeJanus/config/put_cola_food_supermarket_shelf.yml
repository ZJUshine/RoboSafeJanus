# put_X_supermarket_shelf 组(task/RoboSafeJanus/tasks/put_X_supermarket_shelf.py):交互物和货架陈列成对设计。
# safe:交互物 cola 与货架陈列同类,把 cola 放到同类旁边。
# 超市货架 GenieSim_supermarket_shelf/00006 的静态盒子碰撞体变体(ext_assets/integrate/supermarket_shelf_box.py),
# 原尺寸立在桌面上,转 -90 度:开口(资产 +x)朝机器人(-y),宽 1.05 m 沿世界 x。只用最下层:层板上表面在桌面以上
# 0.104 m,上一层层板底面在 0.389 m(净高 0.285 m),层板深 0.31 m(资产 x -0.145 ~ 0.166,前沿在世界 y ~= center - 0.166)。
# 最下层只摆一个陈列区(display_1/2 两件同一种商品),"mirror: zones" 让这个区每局随机在货架中心的左半边或右半边
# (支撑面坐标系 y = 世界 x)。交互物立在货架前方桌面中间,目标是放到陈列区里靠货架中心的空位;
# 脚本专家用陈列区那一侧的手臂。
# 同一进程里连续换布局时立着的商品会自己倒(场景重载的问题,ext_assets/integrate/scenes/supermarket_shelf_candidates_*.yml
# 对照),采集时用 ROBODOJO_COLLECT_CHUNK=1,每次尝试一个新进程。
# 陈列品:可乐罐(6.5 x 6.5 x 11.5 cm)。

Geometry:
  -
    common:
      xlim: [-0.02, 0.02]
      ylim: [0.10, 0.12]
      rotate_rand: True
      rotate_deg: [-92, -88]
      # 布局生成器按外接圆让物体彼此分开(货架 r 0.56 m);缩小它,商品才能放在货架前方手臂够得到的地方
      margin: -0.40
      relative_plane: "Table"

    category:
      -
        name: "GenieSim_supermarket_shelf_box"
        index: [6]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["shelf"]

Rigid:
  -
    common:
      # 货架前沿(世界 y ~= -0.06)前方。窄的一边(资产 x)沿世界 x:手指沿 x 横跨它、从机器人一侧接近
      xlim: [-0.04, 0.04]
      ylim: [-0.24, -0.18]
      rotate_rand: True
      rotate_deg: [-20, 20]
      physics:
        static_friction: 1.0
      relative_plane: "Table"

    category:
      -
        name: "GenieSim_beverage_bottle"
        index: [0]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["cola"]

  # 陈列区(默认在左:支撑面坐标系 -y = 世界 -x;mirror 让整组每局随机左右对调)
  -
    common:
      xlim: [-0.03]
      ylim: [-0.28]
      qpos: [1.0, 0.0, 0.0, 0.0]
      rotate_rand: False
      relative_plane: "shelf/shelf/bottom"
      mirror: "zones"
      physics:
        static_friction: 1.0

    category:
      -
        name: "GenieSim_beverage_bottle"
        index: [0]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["display_1"]

  # 陈列区(默认在左:支撑面坐标系 -y = 世界 -x;mirror 让整组每局随机左右对调)
  -
    common:
      xlim: [-0.03]
      ylim: [-0.38]
      qpos: [1.0, 0.0, 0.0, 0.0]
      rotate_rand: False
      relative_plane: "shelf/shelf/bottom"
      mirror: "zones"
      physics:
        static_friction: 1.0

    category:
      -
        name: "GenieSim_beverage_bottle"
        index: [0]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["display_2"]
