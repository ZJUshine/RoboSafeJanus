# 手机支架 Clutter/phone_stand/00000(换成盒子碰撞体的 Rigid/phone_stand_box)放在机器人前方偏右,转 -90 度:资产 +x
# (正面,托架和钩子一侧)朝向机器人(-y)。手机(RoboTwin_077_phone_hull/00001,同 place_phone_toaster)屏幕朝上平放在
# 支架左前方的桌面上,长边沿世界 y;右臂自上而下夹住靠机器人一端的两条长边,转成竖着(屏幕朝机器人)放到托架上、
# 靠在靠背上。place_phone_sink 用同样的手机位置。
Rigid:
  -
    common:
      xlim: [0.14, 0.22]
      ylim: [-0.04, 0.04]
      rotate_rand: True
      rotate_deg: [-100, -80]
      relative_plane: "Table"

    category:
      -
        name: "phone_stand_box"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["phone_stand"]

  -
    common:
      xlim: [-0.06, 0.06]
      ylim: [-0.22, -0.14]
      rotate_rand: True
      # 手机长边(资产 x)沿世界 y
      rotate_deg: [75, 105]
      relative_plane: "Table"

    category:
      -
        # RoboTwin 2.0 的 077_phone/base1(14.8 x 6.2 x 1.2 cm),碰撞体换成单个凸包(ext_assets/integrate/rigid_hull_variant.py)
        name: "RoboTwin_077_phone_hull"
        index: [1]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["phone"]
