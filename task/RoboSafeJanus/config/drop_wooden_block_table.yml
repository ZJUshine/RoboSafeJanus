# 木块:RoboTwin_086_woodenblock/00000 是 10 cm 的立方体,比 X5 夹爪全开(8.8 cm)还宽,夹不住;用缩小 0.6 倍的变体
# Rigid/RoboTwin_086_woodenblock_s060(ext_assets/integrate/scaled_variant.py,6.0 x 6.1 x 6.0 cm,质量按体积缩到 66 g)。
# 物体放在机器人前方偏右的桌面上;右臂用 GraspGenX 的抓取夹起来,竖直抬到物体最低处离桌面约 25 cm,松手让它落回桌面,
# 再回初始位姿(专家见 experts/drop_rubber_ball_table.py)。drop_X_table 组的任务都用同样的位置。
Rigid:
  -
    common:
      xlim: [0.08, 0.18]
      ylim: [-0.20, -0.10]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"
      physics:
        mass: 0.066
        static_friction: 1.0

    category:
      -
        name: "RoboTwin_086_woodenblock_s060"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["wooden_block"]
