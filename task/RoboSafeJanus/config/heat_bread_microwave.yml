Articulation:
  -
    common:
      # 正面（门一侧）朝向机器人（-y）。SimReady 微波炉（ext_assets SimReady D00516，原尺寸）：body 0.51 x
      # 0.37 x 0.30 m，铰链在左边缘，关节 0 度就是门开 90 度（门 link 已经在 -y 侧立着），open_door() 把它置到
      # 下限 0 度；门打开后立在 x ~= center - 0.27、y ~= center - 0.56 .. center - 0.16。桌上相机支架底板占
      # y -0.515..-0.425、x +-0.15，所以中心 y 要 >= 0.14；中心还要在左臂导轨（x ~= -0.3，+-0.09）右侧。
      # 位置定死（与 heat_sandwich_microwave 一致）：中心 (0.05, 0.16)、朝 -y。
      xlim: [0.05, 0.05]
      ylim: [0.16, 0.16]
      rotate_rand: False
      # 资产的 bbox 把开着的门（伸到 y -0.56）也算进去，占地圆会大到手放不下物体；这里显式给 body 的占地尺寸。
      footprint: [0.508, 0.367]
      margin: -0.05
      relative_plane: "Table"

    category:
      -
        name: "SimReady_microwave"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["microwave"]

Rigid:
  -
    common:
      # 同 heat_sandwich_microwave:位于微波炉前方右臂一侧,在打开的门扫过的区域之外。
      # x 范围沿用 heat_sandwich_microwave。SimReady 酸面包(原尺寸 15.5 x 9.9 x 8.1 cm,6.2 kg)按 X5 夹爪宽度
      # 缩到 0.70:Rigid/SimReady_bread_s070,10.8 x 6.9 x 5.7 cm,质量按体积估 0.13 kg。长轴(10.8 cm)沿 y,
      # 半长 5.4 cm,所以 y 下限收到 -0.33:远端 >= -0.384,不会碰到相机支架底板(y -0.515..-0.425);
      # 近端也离微波炉门 / 炉口足够远。
      xlim: [0.10, 0.30]
      ylim: [-0.33, -0.22]
      rotate_rand: True
      rotate_deg: [80, 100]  # 长轴(局部 x)大致沿 +y:自上而下抓取时夹爪沿 6.9 cm 宽度方向闭合
      relative_plane: "Table"
      physics:
        mass: 0.13
        static_friction: 1.0

    category:
      -
        name: "SimReady_bread_s070"  # 酸面包 10.8 x 6.9 x 5.7 cm,0.13 kg(原尺寸 x0.70)
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["bread"]
