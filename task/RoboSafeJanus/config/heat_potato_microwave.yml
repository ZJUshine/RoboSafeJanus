Articulation:
  -
    common:
      # 正面（门一侧）朝向机器人（-y）。SimReady 微波炉（ext_assets SimReady D00516，原尺寸）：body 0.51 x
      # 0.37 x 0.30 m，铰链在左边缘，关节 0 度就是门开 90 度（门 link 已经在 -y 侧立着），open_door() 把它置到
      # 下限 0 度；门打开后立在 x ~= center - 0.27、y ~= center - 0.56 .. center - 0.16。桌上相机支架底板占
      # y -0.515..-0.425、x +-0.15，所以中心 y 要 >= 0.14；中心还要在左臂导轨（x ~= -0.3，+-0.09）右侧。
      # 位置定死（与 heat_egg_microwave / heat_sandwich_microwave 一致）：中心 (0.05, 0.16)、朝 -y。
      xlim: [0.05, 0.05]
      ylim: [0.16, 0.16]
      rotate_rand: False
      # 资产的 bbox 把开着的门（伸到 y -0.56）也算进去，占地圆会大到手放不下土豆；这里显式给 body 的占地尺寸。
      footprint: [0.508, 0.367]
      margin: -0.05
      relative_plane: "Table"

    category:
      -
        name: "SimReady_microwave"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["microwave"]

Rigid:
  -
    common:
      # 微波炉前方偏右（在打开的门那块竖板 x ~= -0.22 的右侧），右臂自上而下抓。
      # 范围沿用 heat_sandwich_microwave / heat_egg_microwave。SimReady 土豆（原尺寸 7.19 x 9.90 x 7.16 cm，
      # 0.1998 kg）缩到 0.95：Rigid/SimReady_potato_s095，6.83 x 9.41 x 6.80 cm，长轴（9.41 cm）沿局部 y，
      # 半长 4.7 cm，所以 y 下限 -0.35 时远端 >= -0.397，不会碰到相机支架底板（y -0.515..-0.425）。
      xlim: [0.10, 0.30]
      ylim: [-0.35, -0.22]
      rotate_rand: True
      # ±55 度：土豆长轴 9.41 cm 超过 X5 夹爪开口 8.8 cm，长轴与"朝里"方向夹角超过约 60 度时
      # 没有可用的自上而下抓取（2026-11-16 可行性扫描：|yaw| <= 54 度 10/10 通过，75–115 度过滤后 0 个候选）。
      # 土豆长轴是对称的（yaw 与 yaw+180 等价），±55 度覆盖了全部物理上不同的可抓朝向，不损失多样性。
      rotate_deg: 55
      relative_plane: "Table"
      # metadata 的 active.place.up 是单位四元数、底面 z = 0，默认姿态就是平放（长轴沿 y），不需要 qpos。
      physics:
        mass: 0.1998  # 资产源数据（SimReady_potato，未缩放）；0.95 缩放变体按体积为 0.1713
        static_friction: 0.6
        dynamic_friction: 1.5

    category:
      -
        name: "SimReady_potato_s095"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["potato"]
