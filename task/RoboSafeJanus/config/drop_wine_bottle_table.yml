# 酒瓶:Rigid/wine_bottle/00000(8.2 x 8.2 x 21.8 cm,瓶颈约 3 cm;资产 friction 0.0,这里设成 1.0)。
# 物体放在机器人前方偏右的桌面上;右臂用 GraspGenX 的抓取夹起来,竖直抬到物体最低处离桌面约 25 cm,松手让它落回桌面,
# 再回初始位姿(专家见 experts/drop_rubber_ball_table.py)。drop_rubber_ball_table / drop_vase_table / drop_glass_cup_table / drop_wine_bottle_table
# 用同样的位置。
Rigid:
  -
    common:
      xlim: [0.08, 0.18]
      ylim: [-0.20, -0.10]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"
      physics:
        mass: 0.4
        static_friction: 1.0

    category:
      -
        name: "wine_bottle"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["wine_bottle"]
