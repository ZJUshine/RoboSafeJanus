# 冰箱放在机器人正前方偏右,正面(门一侧)朝向机器人(-y)。下门铰接在冰箱右边缘,任务在 reset 时把它开到 120 度,
# 门板从铰链(冰箱坐标系 x 0.207、y -0.170)斜向右前方伸出 0.42 m,门尖在世界 x ~= center + 0.42、y ~= center - 0.53,
# 在右臂基座(0.3, -0.45)右侧,不挡右臂。最下层隔板上表面在冰箱底面以上 0.249 m,即桌面以上 0.249 m;
# 右臂水平夹爪在 y <= 0.2 处 TCP 能到桌面以上 0.42 m(/tmp/hz/fridge/reach_side.py 离线 IK)。
Articulation:
  -
    common:
      xlim: [0.20, 0.26]
      ylim: [0.12, 0.15]
      rotate_rand: True
      rotate_deg: [-5, 5]
      # 布局生成器按外接圆让物体彼此分开(冰箱 r 0.227 m);缩小它,物体才能放在冰箱门口前右臂够得到的地方
      margin: -0.08
      relative_plane: "Table"

    category:
      -
        # ArtVIP 冰箱 00001 的盒子碰撞体变体缩放到 0.7(0.42 x 0.45 x 1.19 m;ext_assets/integrate/fridge_box.py +
        # scaled_variant.py):最下层隔板到上一层隔板底面净高 0.30 m。每个任务只用一个模型:关节体在每个进程里只生成一次,
        # 之后的布局都复用它(src/data_collect/collect_env._reuse_live_articulations)
        name: "ArtVIP_refrigerator_box_s070"
        index: [1]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["refrigerator"]

Rigid:
  -
    common:
      # 冰箱前方、右臂一侧。洁厕剂瓶缩放到 0.8(4.5 x 9.1 x 21.6 cm):原尺寸 27 cm,
      # 抓起后略倾斜就有 28 cm,冷藏室最下层净高 30 cm 放不进去。长的一边(资产 y)大致沿 y 摆,
      # 夹爪横跨 4.5 cm 的一边、从机器人一侧接近;y 再往后时瓶子前端碰到冰箱前沿,布局一沉降冰箱就被顶开
      xlim: [0.12, 0.28]
      ylim: [-0.21, -0.17]
      rotate_rand: True
      rotate_deg: [-25, 25]
      physics:
        static_friction: 1.0
      relative_plane: "Table"

    category:
      -
        name: "GenieSim_cleaning_products_s080"
        index: [11]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["toilet_cleaner"]
