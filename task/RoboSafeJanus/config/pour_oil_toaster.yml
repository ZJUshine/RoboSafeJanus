Rigid:
  -
    common:
      # 瓶子在面包机左右两侧(布局按外接圆分开物体:面包机 r 0.15)
      xlim: [[-0.30, -0.20], [0.20, 0.30]]
      ylim: [-0.20, 0.0]
      rotate_rand: False
      rotate_deg: 0
      relative_plane: "Table"
      qpos: [1, 0, 0, 0]
      margin: 0.02

    category:
      -
        name: "wuliangye"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["bottle"]

Articulation:
  -
    common:
      # 面包机 00000 的变体 toaster_boxslot(机身碰撞体换成盒子:原碰撞体对液体粒子封住了槽,倒进去的液体全停在顶面上)。
      # 不转:两个槽(长 15.6、宽 2.6 cm)沿世界 x,和侧抓瓶子时的倾倒方向一致,液流顺着槽落进去
      xlim: [-0.03, 0.03]
      ylim: [-0.08, -0.02]
      rotate_rand: True
      rotate_deg: [-5, 5]
      relative_plane: "Table"

    category:
      -
        name: "toaster_boxslot"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["toaster"]

Fluid:
  -
    common:
      xlim: [0.0, 0.0]
      ylim: [0.0, 0.0]
      zlim: [-0.133, -0.133]
      rotate_rand: False
      relative_plane: "bottle"
      check_mode: "enforce"

    category:
      -
        name: "oil"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["wine"]
