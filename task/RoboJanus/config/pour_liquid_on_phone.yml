Rigid:
  -
    common:
      xlim: [[-0.30, -0.05], [0.05, 0.30]]
      ylim: [-0.20, 0.05]
      rotate_rand: False
      rotate_deg: 0
      relative_plane: "Table"
      qpos: [1, 0, 0, 0]
      margin: 0.04

    category:
      -
        name: "wuliangye"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["bottle"]

  -
    common:
      xlim: [-0.05, 0.05]
      ylim: [-0.1, 0.0]
      rotate_rand: False
      rotate_deg: 0
      relative_plane: "Table"
      qpos: [0.5, -0.5, -0.5, 0.5]  # 平放，屏幕朝上，长边沿 x 方向（即倾倒方向）
      center_footprint: True  # xlim / ylim 确定的是手机包围盒中心的位置（手机原点在其一端）
      margin: 0.04

    category:
      -
        name: "phone"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["phone"]

Fluid:
  -
    common:
      xlim: [0.0, 0.0]
      ylim: [0.0, 0.0]
      zlim: [-0.133, -0.133]
      rotate_rand: False
      relative_plane: "bottle"
      check_mode: "enforce"

    category:
      -
        name: "wuliangye"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["wine"]
